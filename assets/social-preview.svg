    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- stopwatch (same drawing as logo.svg) -->
  <g transform="translate(330 330) scale(1.3) translate(-250 -248)">
    <rect x="222" y="92" width="56" height="34" rx="10" fill="#fff"/>
    <rect x="241" y="118" width="18" height="30" fill="#fff"/>
    <rect x="336" y="164" width="34" height="22" rx="8" fill="#fff" transform="rotate(45 353 175)"/>
    <circle cx="250" cy="275" r="130" fill="#fff"/>
    <circle cx="250" cy="275" r="104" fill="none" stroke="#e0e7ff" stroke-width="10"/>
    <path d="M250 171 A104 104 0 0 1 340 327" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 205v70l48 30" fill="none" stroke="#312e81" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
